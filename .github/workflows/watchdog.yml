name: Terrace Painting Watchdog

on:
  schedule:
    # 09:00 Europe/Vienna, split into two cron entries since a single UTC
    # time can't track the CEST/CET switch: 07:00 UTC during CEST (Apr-Oct),
    # 08:00 UTC during CET (Nov-Mar). Off by up to an hour in the DST
    # switchover week, which is fine for a daily weather digest.
    - cron: "0 7 * 4-10 *"
    - cron: "0 8 * 11,12,1,2,3 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: node dist/index.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}

      - name: Commit updated dashboard
        run: |
          if ! git diff --quiet -- docs/index.html; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html
            git commit -m "chore: update watchdog dashboard"
            git push
          fi
