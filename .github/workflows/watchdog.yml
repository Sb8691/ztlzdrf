name: Terrace Painting Watchdog

on:
  schedule:
    # ~09:00 Europe/Vienna, split into two cron entries since a single UTC time can't track the
    # CEST/CET switch: 07:xx UTC during CEST (Apr-Oct), 08:xx UTC during CET (Nov-Mar). Off by up
    # to an hour in the DST switchover week, which is fine for a daily weather digest.
    #
    # Deliberately NOT running at the top of the hour (:00): GitHub's own docs warn that scheduled
    # workflows are queued and can be delayed or silently dropped under load, "especially at the
    # start of the hour" - the busiest moment across all of GitHub Actions. :13 avoids that peak.
    - cron: "13 7 * 4-10 *"
    - cron: "13 8 * 11,12,1,2,3 *"
  workflow_dispatch: {}

permissions:
  contents: write

# Serializes runs so two overlapping triggers (e.g. a manual dispatch landing seconds apart from
# another) never race on the git push in the steps below - queued runs wait their turn instead of
# one of them failing outright and (previously) skipping the e-mail entirely as a result.
concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      # Generates docs/index.html + docs/chart.png without sending the e-mail yet - the e-mail
      # links to the chart as a hosted image (Gmail strips inline <svg> and refuses data: URIs),
      # so that image has to actually be live on GitHub Pages *before* the e-mail goes out, or an
      # early open shows a permanently broken image (each e-mail's chart URL is cache-busted and
      # only ever fetched once).
      - name: Generate dashboard + chart (no e-mail yet)
        run: node dist/index.js
        env:
          SEND_EMAIL: "false"

      # If this push is rejected (another run's commit landed first, despite the concurrency
      # group above - e.g. a commit pushed outside this workflow), we retry by re-basing our
      # already-generated docs/ output onto the new tip with `reset --soft` rather than giving up:
      # a hard failure here must never skip sending the e-mail below, which is the whole point of
      # this workflow. Regenerating isn't needed - the content we already produced is still this
      # run's correct output regardless of which commit it lands on top of.
      - name: Publish dashboard so the chart image is live before the e-mail links to it
        id: publish
        run: |
          if ! git diff --quiet -- docs/index.html docs/chart.png; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html docs/chart.png
            git commit -m "chore: update watchdog dashboard"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::warning::Could not push dashboard update after 5 attempts - continuing without publishing this run's chart."
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing our commit onto the latest main and retrying..."
              git fetch origin
              git reset --soft origin/main
              git add docs/index.html docs/chart.png
              git commit -m "chore: update watchdog dashboard"
            done
          fi

      - name: Wait for GitHub Pages to actually serve the new chart
        if: steps.publish.outputs.published == 'true'
        run: |
          local_hash=$(sha256sum docs/chart.png | cut -d' ' -f1)
          for i in $(seq 1 24); do
            remote_hash=$(curl -s "https://sb8691.github.io/ztlzdrf/chart.png?cb=$RANDOM$RANDOM" | sha256sum | cut -d' ' -f1)
            if [ "$remote_hash" = "$local_hash" ]; then
              echo "GitHub Pages is serving the fresh chart (attempt $i)."
              exit 0
            fi
            echo "Not live yet (attempt $i/24), waiting 10s..."
            sleep 10
          done
          echo "::warning::GitHub Pages didn't confirm the new chart within the timeout; sending the e-mail anyway."

      - name: Send e-mail
        run: node dist/index.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}

      # Same non-fatal retry as the publish step above - by this point the e-mail has already been
      # sent, so a push failure here must only ever cost a slightly stale published dashboard until
      # the next run, never fail the whole job.
      - name: Commit any dashboard drift from the final run
        run: |
          if ! git diff --quiet -- docs/index.html docs/chart.png; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html docs/chart.png
            git commit -m "chore: update watchdog dashboard"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::warning::Could not push final dashboard drift after 5 attempts."
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing our commit onto the latest main and retrying..."
              git fetch origin
              git reset --soft origin/main
              git add docs/index.html docs/chart.png
              git commit -m "chore: update watchdog dashboard"
            done
          fi
