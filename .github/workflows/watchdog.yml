name: Terrace Painting Watchdog

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: node dist/index.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}

      - name: Commit updated state and dashboard
        run: |
          if ! git diff --quiet -- state.json docs/index.html; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json docs/index.html
            git commit -m "chore: update watchdog state and dashboard"
            git push
          fi
