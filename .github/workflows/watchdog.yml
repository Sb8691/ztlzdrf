name: Terrace Painting Watchdog

on:
  schedule:
    # ~09:00 Europe/Vienna, split into two cron entries since a single UTC time can't track the
    # CEST/CET switch: 07:xx UTC during CEST (Apr-Oct), 08:xx UTC during CET (Nov-Mar). Off by up
    # to an hour in the DST switchover week, which is fine for a daily weather digest.
    #
    # Deliberately NOT running at the top of the hour (:00): GitHub's own docs warn that scheduled
    # workflows are queued and can be delayed or silently dropped under load, "especially at the
    # start of the hour" - the busiest moment across all of GitHub Actions. :13 avoids that peak.
    - cron: "13 7 * 4-10 *"
    - cron: "13 8 * 11,12,1,2,3 *"
    # Outlook-only snapshots (no e-mail). UTC-fixed on purpose: the ECMWF ensemble cycles that reach
    # 15 days are 00z and 12z, and Open-Meteo has them roughly 9-10 h after initialisation (~09:30
    # and ~21:30 UTC), so these two runs capture each cycle once. The outlook script is idempotent -
    # if nothing new has landed yet, it changes nothing and no commit is made.
    - cron: "13 11 * * *"
    - cron: "13 23 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the daily e-mail (off = only refresh the dashboard and the outlook)"
        type: boolean
        default: true

permissions:
  contents: write

# Serializes runs so two overlapping triggers (e.g. a manual dispatch landing seconds apart from
# another) never race on the git push in the steps below - queued runs wait their turn instead of
# one of them failing outright and (previously) skipping the e-mail entirely as a result.
concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  # The e-mail goes out only from the morning schedules or an explicit manual request; the
  # outlook-only schedules just refresh the published pages.
  EMAIL_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_email == true) || github.event.schedule == '13 7 * 4-10 *' || github.event.schedule == '13 8 * 11,12,1,2,3 *' }}

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Medium-range outlook for the configured painting window (src/outlook.ts): appends this
      # model run's summary to docs/outlook/history.json (skipped when already captured) and
      # re-renders docs/outlook.html + docs/outlook.png. Never allowed to break the daily run - the
      # dashboard/e-mail below only read whatever history exists.
      - name: Update medium-range outlook
        run: node dist/outlook.js
        continue-on-error: true

      # Generates docs/index.html + docs/chart.png without sending the e-mail yet - the e-mail
      # links to the chart as a hosted image (Gmail strips inline <svg> and refuses data: URIs),
      # so that image has to actually be live on GitHub Pages *before* the e-mail goes out, or an
      # early open shows a permanently broken image (each e-mail's chart URL is cache-busted and
      # only ever fetched once).
      - name: Generate dashboard + chart (no e-mail yet)
        run: node dist/index.js
        env:
          SEND_EMAIL: "false"

      # Everything under docs/ is published (dashboard, chart, outlook page/image and the outlook
      # history). `git add -A docs` + `git diff --cached` is what makes brand-new files count -
      # `git diff --quiet` alone never sees untracked files.
      #
      # If the push is rejected (another commit landed first, despite the concurrency group above -
      # e.g. a commit pushed outside this workflow), our commit is rebased onto the new tip with
      # conflicts in docs/ resolved in favour of this run's output (`-X theirs` = the commit being
      # replayed, i.e. ours). A hard failure here must never skip sending the e-mail below.
      - name: Publish dashboard so the chart image is live before the e-mail links to it
        id: publish
        run: |
          git add -A docs
          if ! git diff --cached --quiet; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: update watchdog dashboard"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::warning::Could not push dashboard update after 5 attempts - continuing without publishing this run's chart."
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing our commit onto the latest main and retrying..."
              git fetch origin
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                echo "::warning::Rebase onto origin/main failed (attempt $i/5)."
              fi
            done
          fi

      - name: Wait for GitHub Pages to actually serve the new images
        if: steps.publish.outputs.published == 'true' && env.EMAIL_RUN == 'true'
        run: |
          for file in chart.png outlook.png; do
            [ -f "docs/$file" ] || continue
            local_hash=$(sha256sum "docs/$file" | cut -d' ' -f1)
            live=false
            for i in $(seq 1 24); do
              remote_hash=$(curl -s "https://sb8691.github.io/ztlzdrf/$file?cb=$RANDOM$RANDOM" | sha256sum | cut -d' ' -f1)
              if [ "$remote_hash" = "$local_hash" ]; then
                echo "GitHub Pages is serving the fresh $file (attempt $i)."
                live=true
                break
              fi
              echo "$file not live yet (attempt $i/24), waiting 10s..."
              sleep 10
            done
            if [ "$live" != "true" ]; then
              echo "::warning::GitHub Pages didn't confirm the new $file within the timeout; sending the e-mail anyway."
            fi
          done

      - name: Send e-mail
        if: env.EMAIL_RUN == 'true'
        run: node dist/index.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}

      # Same non-fatal retry as the publish step above - by this point the e-mail has already been
      # sent, so a push failure here must only ever cost a slightly stale published dashboard until
      # the next run, never fail the whole job.
      - name: Commit any dashboard drift from the final run
        if: env.EMAIL_RUN == 'true'
        run: |
          git add -A docs
          if ! git diff --cached --quiet; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: update watchdog dashboard"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::warning::Could not push final dashboard drift after 5 attempts."
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing our commit onto the latest main and retrying..."
              git fetch origin
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                echo "::warning::Rebase onto origin/main failed (attempt $i/5)."
              fi
            done
          fi
