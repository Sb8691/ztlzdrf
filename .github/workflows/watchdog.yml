name: Terrace Painting Watchdog

on:
  schedule:
    # Every entry below is only a wake-up. Each run refreshes the page, and the daily e-mail goes out
    # from the FIRST scheduled run of the Europe/Vienna day, from 02:00 local on, that finds no record
    # of today's e-mail (the "gate" step, rule in src/email-gate.ts). So no single cron entry is the
    # e-mail any more, and a delayed or dropped run costs nothing as long as a later one comes.
    #
    # Why that matters, measured 28 Aug - 22 Sep 2026: the old 07:13 UTC e-mail slot ran 26 times out
    # of 26, created a median 5.3 h late (min 4.1, p90 6.9, max 12.2). The 27 Aug slot produced no run
    # at all - GitHub's docs say that under high load "some queued jobs may be dropped". On 23 Sep the
    # e-mail slot was moved from 07:13 to 00:13 UTC after that day's 00:13 had already passed, so the
    # day had no e-mail slot at all. Changing a cron string does not bring back a slot that is gone.
    #
    # 11:13 and 23:13 UTC catch the ECMWF 00z and 12z ensemble runs (~9-10 h after initialisation on
    # Open-Meteo); 00:13 UTC is 02:13 CEST (01:13 UTC = 02:13 CET in Nov-Mar). Which one sends is
    # simply whichever lands first after 02:00 local: with hours of queue delay that is usually the
    # late 23:13 run in the early morning, else the 00:13 one, else 11:13 in the evening. None of
    # them runs at :00, the busiest moment ("High load times include the start of every hour").
    - cron: "13 0 * 4-10 *"
    - cron: "13 1 * 11,12,1,2,3 *"
    - cron: "13 11 * * *"
    - cron: "13 23 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the e-mail now - it then counts as today's e-mail (off = only refresh the page)"
        type: boolean
        default: false
      force_render:
        description: "Re-render the outlook page and image even if no new model run landed (use after changing how they look)"
        type: boolean
        default: false

permissions:
  contents: write

# Serializes runs so two overlapping triggers (e.g. a manual dispatch landing seconds apart from
# another) never race on the git push in the steps below - queued runs wait their turn instead of
# one of them failing outright and (previously) skipping the e-mail entirely as a result.
#
# queue: max - by default a newly queued run cancels one that is already pending, and that one might
# have been the run meant to send the day's e-mail. With `max` up to 100 runs wait their turn.
concurrency:
  group: watchdog
  cancel-in-progress: false
  queue: max

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Does this run send the day's e-mail? The rule is in src/email-gate.ts; this step only fetches
      # the record of the last e-mail (docs/data/email-sent.json) from main as it is NOW - not from
      # the checkout, which for a run that waited in the queue can predate the run that just sent -
      # and through the API rather than git, so the shallow clone the push loops below rebase in
      # stays exactly as it was.
      #
      # Fails open on purpose: a missing record (404), an API hiccup or a crash all end in send=true.
      # The steps below test `!= 'false'`, so even an output that was never written means "send".
      # The worst this step can cause is a second e-mail, never a missing one.
      - name: Decide whether this run sends the daily e-mail
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_SEND: ${{ inputs.send_email == true }}
        run: |
          marker="$RUNNER_TEMP/email-sent.json"
          if ! gh api -H "Accept: application/vnd.github.raw+json" "repos/${{ github.repository }}/contents/docs/data/email-sent.json?ref=main" > "$marker" 2>/dev/null; then
            rm -f "$marker"
          fi
          node dist/should-send-email.js "$marker" || echo "send=true" >> "$GITHUB_OUTPUT"

      # Medium-range outlook for the configured painting window (src/outlook.ts): appends this
      # model run's summary to docs/outlook/history.json (skipped when already captured) and
      # re-renders docs/outlook.html + docs/outlook.png. Never allowed to break the daily run - the
      # dashboard/e-mail below only read whatever history exists.
      - name: Update medium-range outlook
        run: node dist/outlook.js
        continue-on-error: true
        env:
          # Only a manual run can ask for this; on a schedule the expression is simply "false", so
          # the usual "nothing new landed -> change nothing" behaviour is untouched.
          OUTLOOK_FORCE_RENDER: ${{ inputs.force_render == true }}

      # Generates docs/index.html + docs/chart.png without sending the e-mail yet - the e-mail
      # links to the chart as a hosted image (Gmail strips inline <svg> and refuses data: URIs),
      # so that image has to actually be live on GitHub Pages *before* the e-mail goes out, or an
      # early open shows a permanently broken image (each e-mail's chart URL is cache-busted and
      # only ever fetched once).
      - name: Generate dashboard + chart (no e-mail yet)
        run: node dist/index.js
        env:
          SEND_EMAIL: "false"

      # Everything under docs/ is published (dashboard, chart, outlook page/image and the outlook
      # history). `git add -A docs` + `git diff --cached` is what makes brand-new files count -
      # `git diff --quiet` alone never sees untracked files.
      #
      # If the push is rejected (another commit landed first, despite the concurrency group above -
      # e.g. a commit pushed outside this workflow), our commit is rebased onto the new tip with
      # conflicts in docs/ resolved in favour of this run's output (`-X theirs` = the commit being
      # replayed, i.e. ours). A hard failure here must never skip sending the e-mail below.
      - name: Publish dashboard so the chart image is live before the e-mail links to it
        id: publish
        run: |
          git add -A docs
          if ! git diff --cached --quiet; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: update watchdog dashboard"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::warning::Could not push dashboard update after 5 attempts - continuing without publishing this run's chart."
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing our commit onto the latest main and retrying..."
              git fetch origin
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                echo "::warning::Rebase onto origin/main failed (attempt $i/5)."
              fi
            done
          fi

      - name: Wait for GitHub Pages to actually serve the new images
        if: steps.publish.outputs.published == 'true' && steps.gate.outputs.send != 'false'
        run: |
          for file in chart.png outlook.png; do
            [ -f "docs/$file" ] || continue
            local_hash=$(sha256sum "docs/$file" | cut -d' ' -f1)
            live=false
            for i in $(seq 1 24); do
              remote_hash=$(curl -s "https://sb8691.github.io/ztlzdrf/$file?cb=$RANDOM$RANDOM" | sha256sum | cut -d' ' -f1)
              if [ "$remote_hash" = "$local_hash" ]; then
                echo "GitHub Pages is serving the fresh $file (attempt $i)."
                live=true
                break
              fi
              echo "$file not live yet (attempt $i/24), waiting 10s..."
              sleep 10
            done
            if [ "$live" != "true" ]; then
              echo "::warning::GitHub Pages didn't confirm the new $file within the timeout; sending the e-mail anyway."
            fi
          done

      # After Resend accepts the e-mail, src/index.ts writes docs/data/email-sent.json for the day the
      # gate decided on; the next step commits it. If sending fails, the job stops here, nothing is
      # recorded, and the next scheduled run tries again.
      - name: Send e-mail
        if: steps.gate.outputs.send != 'false'
        run: node dist/index.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RECORD_EMAIL: "true"
          EMAIL_FOR_DATE: ${{ steps.gate.outputs.date }}

      # Same non-fatal retry as the publish step above - by this point the e-mail has already been
      # sent, so a push failure here must only ever cost a slightly stale published dashboard until
      # the next run, never fail the whole job. It also carries the e-mail record; if all five pushes
      # fail, the record is lost and the next run sends a second e-mail - never none.
      - name: Commit any dashboard drift from the final run
        if: steps.gate.outputs.send != 'false'
        run: |
          git add -A docs
          if ! git diff --cached --quiet; then
            git config user.name "terrace-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: update watchdog dashboard"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::warning::Could not push final dashboard drift after 5 attempts."
                break
              fi
              echo "Push rejected (attempt $i/5) - rebasing our commit onto the latest main and retrying..."
              git fetch origin
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                echo "::warning::Rebase onto origin/main failed (attempt $i/5)."
              fi
            done
          fi
